<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22301f">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantas">
<title>Minhas Plantas</title>
<style>
  :root{
    --dark:#22301f;
    --mid:#4f7d4a;
    --light:#dcefd5;
    --bg:#f6f5f0;
    --card:#ffffff;
    --ink:#26301f;
    --ink-soft:#6b7166;
    --line:#e6e3d8;
    --green:#3f8f5c;
    --green-bg:#e3f3e6;
    --amber:#b8860b;
    --amber-bg:#fbf1d9;
    --red:#c1493f;
    --red-bg:#fbe6e3;
    --gray:#9a988f;
    --gray-bg:#eeece4;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overscroll-behavior-y:none;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  header.topbar{
    padding:18px 20px 14px;
    background:var(--dark);
    color:#fff;
    position:sticky;
    top:0;
    z-index:5;
  }
  header.topbar h1{
    margin:0;
    font-size:21px;
    font-weight:700;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  header.topbar h1 .title{display:flex;align-items:center;gap:8px;}
  header.topbar p{
    margin:4px 0 0;
    font-size:13px;
    color:#cfe0c9;
  }
  .backup-btn{
    border:none;background:rgba(255,255,255,.14);color:#fff;
    width:34px;height:34px;border-radius:50%;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .backup-btn:active{background:rgba(255,255,255,.28);}
  main{
    flex:1;
    padding:14px 14px 90px;
  }
  .summary-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .summary-pill{
    flex:1;
    background:var(--card);
    border-radius:14px;
    padding:10px 8px;
    text-align:center;
    border:1px solid var(--line);
  }
  .summary-pill .n{
    font-size:20px;
    font-weight:700;
    display:block;
    line-height:1.1;
  }
  .summary-pill .l{
    font-size:10.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .vcard{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:12px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .vcard img{
    width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;
    background:#eee;
  }
  .vcard .info{flex:1;min-width:0;}
  .vcard .info .name{
    font-weight:600;font-size:15px;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .vcard .info .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .status-pill{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:5px;
  }
  .status-ok{background:var(--green-bg);color:var(--green);}
  .status-atencao{background:var(--amber-bg);color:var(--amber);}
  .status-verificar{background:var(--red-bg);color:var(--red);}
  .status-semregistro{background:var(--gray-bg);color:var(--gray);}
  .water-btn{
    border:none;background:var(--mid);color:#fff;font-size:19px;
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(79,125,74,.35);
  }
  .water-btn:active{transform:scale(0.92);}
  nav.tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:520px;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1;border:none;background:none;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:11px;font-family:inherit;font-weight:600;
    border-radius:12px;
  }
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--mid);background:var(--light);}
  .section-title{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;
    margin:18px 4px 8px;
  }
  .empty{
    text-align:center;color:var(--ink-soft);font-size:13.5px;
    padding:30px 20px;
  }
  /* modal */
  .backdrop{
    position:fixed;inset:0;background:rgba(20,25,15,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:20;
  }
  .backdrop.open{display:flex;}
  .sheet{
    background:var(--bg);width:100%;max-width:520px;
    border-radius:22px 22px 0 0;
    max-height:88vh;overflow-y:auto;
    padding:0 0 24px;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet .handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:10px auto 4px;}
  .sheet img.hero{width:100%;height:200px;object-fit:cover;}
  .sheet .content{padding:16px 20px 0;}
  .sheet h2{margin:0 0 2px;font-size:20px;}
  .sheet .sci{font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-bottom:10px;}
  .sheet .block{margin-bottom:14px;}
  .sheet .block .lbl{font-size:11.5px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .sheet .block p{margin:0;font-size:14px;line-height:1.5;}
  .sheet .actions{display:flex;gap:10px;padding:4px 20px 6px;}
  .btn{
    flex:1;border:none;border-radius:14px;padding:13px;font-size:14.5px;
    font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--mid);color:#fff;}
  .btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn:active{opacity:.8;}
  .close-x{
    position:absolute;top:14px;right:14px;background:rgba(0,0,0,.35);color:#fff;
    border:none;width:30px;height:30px;border-radius:50%;font-size:16px;
  }
  .sheet-rel{position:relative;}
  .hist-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;margin-bottom:8px;font-size:13.5px;
  }
  .hist-row .who{font-weight:600;}
  .hist-row .when{color:var(--ink-soft);font-size:12px;}
  .hist-del{border:none;background:none;color:var(--red);font-size:18px;padding:4px 6px;}
  .toast{
    position:fixed;bottom:82px;left:50%;transform:translateX(-50%);
    background:var(--dark);color:#fff;padding:12px 12px 12px 18px;border-radius:18px;
    font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:max-content;max-width:86vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);pointer-events:auto;}
  .toast span{line-height:1.3;}
  .toast-undo{
    border:none;background:rgba(255,255,255,.18);color:#bfe6ff;
    font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px;
    font-family:inherit;flex-shrink:0;white-space:nowrap;
  }
  .toast-undo:active{background:rgba(255,255,255,.32);}
  input[type=date]{
    font-family:inherit;font-size:14px;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line);width:100%;background:#fff;color:var(--ink);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1><span class="title">🌿 Minhas Plantas</span><button class="backup-btn" id="openBackup" title="Backup">⤓</button></h1>
    <p id="todayLabel"></p>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="status" class="active"><span class="ic">🏠</span>Status</button>
    <button data-tab="historico"><span class="ic">🕒</span>Histórico</button>
  </nav>
</div>

<div class="backdrop" id="backdrop">
  <div class="sheet sheet-rel" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

function loadLog(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw === null){
    saveLog(SEED_LOG.slice());
    return SEED_LOG.slice();
  }
  try{ return JSON.parse(raw) || []; }catch(e){ return []; }
}
function saveLog(log){ localStorage.setItem(STORE_KEY, JSON.stringify(log)); }

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function daysBetween(iso){
  const a = new Date(iso+'T00:00:00');
  const b = new Date(todayStr()+'T00:00:00');
  return Math.round((b-a)/86400000);
}

function lastWatering(num){
  const log = loadLog().filter(e=>e.num===num);
  if(!log.length) return null;
  return log.reduce((max,e)=> e.data > max ? e.data : max, log[0].data);
}
function totalWaterings(num){
  return loadLog().filter(e=>e.num===num).length;
}
function statusFor(v){
  const last = lastWatering(v.num);
  if(!last) return {key:'semregistro', label:'⚪ sem registro', dias:null};
  const dias = daysBetween(last);
  if(dias > v.max) return {key:'verificar', label:'🔴 verificar', dias};
  if(dias >= v.min) return {key:'atencao', label:'🟡 atenção', dias};
  return {key:'ok', label:'🟢 ok', dias};
}
const statusOrder = {verificar:0, atencao:1, semregistro:2, ok:3};

function logWatering(num, dataIso){
  const log = loadLog();
  const entry = {num, data: dataIso, ts: Date.now()};
  log.push(entry);
  saveLog(log);
  return entry.ts;
}
function deleteEntry(ts){
  saveLog(loadLog().filter(e=>e.ts!==ts));
  render();
}

function showToast(msg, undoFn){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if(undoFn){
    const btn = document.createElement('button');
    btn.textContent = 'Desfazer';
    btn.className = 'toast-undo';
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      undoFn();
      t.classList.remove('show');
    };
    t.appendChild(btn);
  }
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), undoFn ? 5000 : 1600);
}

let activeTab = 'status';

function renderStatus(){
  const withStatus = VASOS.map(v=>({v, s: statusFor(v)}));
  withStatus.sort((a,b)=> statusOrder[a.s.key]-statusOrder[b.s.key] || a.v.num-b.v.num);

  const counts = {verificar:0, atencao:0, ok:0, semregistro:0};
  withStatus.forEach(x=>counts[x.s.key]++);

  let html = `
    <div class="summary-row">
      <div class="summary-pill"><span class="n">${counts.verificar}</span><span class="l">verificar</span></div>
      <div class="summary-pill"><span class="n">${counts.atencao}</span><span class="l">atenção</span></div>
      <div class="summary-pill"><span class="n">${counts.ok}</span><span class="l">ok</span></div>
      <div class="summary-pill"><span class="n">${counts.semregistro}</span><span class="l">sem registro</span></div>
    </div>
  `;

  html += withStatus.map(({v,s})=>{
    const diasTxt = s.dias===null ? 'nunca registrado' : (s.dias===0 ? 'regado hoje' : `há ${s.dias} dia${s.dias===1?'':'s'}`);
    return `
    <div class="vcard" data-num="${v.num}">
      <img src="data:image/jpeg;base64,${v.foto}" alt="${v.nome}">
      <div class="info" data-open="${v.num}">
        <div class="name">${v.num}. ${v.nome}</div>
        <div class="meta">${diasTxt}</div>
        <span class="status-pill status-${s.key}">${s.label}</span>
      </div>
      <button class="water-btn" data-water="${v.num}" title="Regar agora">💧</button>
    </div>`;
  }).join('');

  return html;
}

function renderHistorico(){
  const log = loadLog().slice().sort((a,b)=>b.ts-a.ts);
  if(!log.length){
    return `<div class="empty">Nenhuma rega registrada ainda.<br>Toque no 💧 de um vaso na aba Status.</div>`;
  }
  return '<div class="section-title">Últimas regas</div>' + log.map(e=>{
    const v = VASOS.find(x=>x.num===e.num);
    return `
    <div class="hist-row">
      <div>
        <div class="who">${e.num}. ${v?v.nome:'?'}</div>
        <div class="when">${fmtDate(e.data)}</div>
      </div>
      <button class="hist-del" data-del="${e.ts}">✕</button>
    </div>`;
  }).join('');
}

function render(){
  document.getElementById('todayLabel').textContent =
    'Hoje é ' + fmtDate(todayStr());
  const view = document.getElementById('view');
  view.innerHTML = activeTab==='status' ? renderStatus() : renderHistorico();

  document.querySelectorAll('[data-water]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const num = Number(btn.dataset.water);
      const ts = logWatering(num, todayStr());
      const v = VASOS.find(x=>x.num===num);
      showToast(`💧 ${v.nome}`, ()=>deleteEntry(ts));
      render();
    });
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(Number(el.dataset.open)));
  });
  document.querySelectorAll('.vcard img').forEach(img=>{
    img.addEventListener('click', ()=> openDetail(Number(img.closest('.vcard').dataset.num)));
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(Number(btn.dataset.del)));
  });
}

function openDetail(num){
  const v = VASOS.find(x=>x.num===num);
  const s = statusFor(v);
  const total = totalWaterings(num);
  const last = lastWatering(num);
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <button class="close-x" id="closeSheet">✕</button>
    <img class="hero" src="data:image/jpeg;base64,${v.foto}" alt="${v.nome}">
    <div class="content">
      <h2>${v.num}. ${v.nome}</h2>
      <div class="sci">${v.cientifico}${v.aprox ? ' · intervalo aproximado' : ''}</div>
      <span class="status-pill status-${s.key}">${s.label}${s.dias!==null ? ' · há '+s.dias+' dia'+(s.dias===1?'':'s') : ''}</span>
      <div class="block" style="margin-top:14px;">
        <div class="lbl">Descrição</div>
        <p>${v.desc}</p>
      </div>
      <div class="block">
        <div class="lbl">💧 Rega</div>
        <p>${v.rega}</p>
      </div>
      <div class="block">
        <div class="lbl">☀️ Luz e cuidados</div>
        <p>${v.luz}</p>
      </div>
      <div class="block">
        <div class="lbl">Histórico</div>
        <p>${total} rega${total===1?'':'s'} registrada${total===1?'':'s'} no total${last? ' · última em '+fmtDate(last) : ''}.</p>
      </div>
      <div class="block">
        <div class="lbl">Registrar rega em outra data</div>
        <input type="date" id="customDate" value="${todayStr()}" max="${todayStr()}">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="logCustom">Registrar nessa data</button>
      <button class="btn btn-primary" id="logToday">💧 Regar agora</button>
    </div>
  `;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('logToday').onclick = ()=>{
    const ts = logWatering(num, todayStr());
    showToast(`💧 ${v.nome}`, ()=>deleteEntry(ts));
    closeSheet(); render();
  };
  document.getElementById('logCustom').onclick = ()=>{
    const d = document.getElementById('customDate').value;
    if(!d) return;
    const ts = logWatering(num, d);
    showToast(`Rega registrada em ${fmtDate(d)}`, ()=>deleteEntry(ts));
    closeSheet(); render();
  };
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function csvEscape(s){
  s = String(s);
  if(/[";\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(){
  const log = loadLog().slice().sort((a,b)=> a.data.localeCompare(b.data) || a.ts-b.ts);
  const rows = [['Data','Nº','Vaso','Observação']];
  log.forEach(e=>{
    const v = VASOS.find(x=>x.num===e.num);
    rows.push([fmtDate(e.data), e.num, v?v.nome:'', e.obs || '']);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  downloadBlob(csv, `regas_backup_${todayStr()}.csv`, 'text/csv;charset=utf-8');
  showToast('CSV exportado 📄');
}

function exportJSON(){
  const payload = {tipo:'minhas_plantas_backup', exportadoEm: new Date().toISOString(), log: loadLog()};
  downloadBlob(JSON.stringify(payload, null, 2), `regas_backup_${todayStr()}.json`, 'application/json');
  showToast('Backup completo exportado 🗄');
}

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.log;
      if(!Array.isArray(incoming)) throw new Error('formato inválido');
      const current = loadLog();
      const seen = new Set(current.map(e=>e.num+'|'+e.data+'|'+e.ts));
      let added = 0;
      incoming.forEach(e=>{
        if(!e || typeof e.num!=='number' || !e.data) return;
        const ts = e.ts || Date.now()+added;
        const key = e.num+'|'+e.data+'|'+ts;
        if(seen.has(key)) return;
        seen.add(key);
        current.push({num:e.num, data:e.data, ts, obs:e.obs||undefined});
        added++;
      });
      saveLog(current);
      showToast(`${added} registro${added===1?'':'s'} importado${added===1?'':'s'} ✅`);
      closeSheet(); render();
    }catch(err){
      showToast('Arquivo inválido para importação');
    }
  };
  reader.readAsText(file);
}

function openBackupSheet(){
  const log = loadLog();
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <button class="close-x" id="closeSheet">✕</button>
    <div class="content" style="padding-top:22px;">
      <h2>Backup</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:2px;">
        ${log.length} rega${log.length===1?'':'s'} registrada${log.length===1?'':'s'} neste aparelho.
      </p>
      <div class="block" style="margin-top:16px;">
        <div class="lbl">Para levar à planilha</div>
        <p>Gera um CSV com as mesmas colunas da aba "Registro de Regas" (Data, Nº, Vaso, Observação). Abra o arquivo e cole as linhas na planilha.</p>
      </div>
      <div class="block">
        <div class="lbl">Backup completo</div>
        <p>Gera um arquivo .json com tudo. Guarde-o em algum lugar seguro (Drive, e-mail) ou use-o para restaurar os dados neste ou em outro aparelho.</p>
      </div>
    </div>
    <div class="actions" style="flex-direction:column;">
      <button class="btn btn-primary" id="btnExportCSV">📄 Exportar CSV (para a planilha)</button>
    </div>
    <div class="actions" style="flex-direction:column;padding-top:0;">
      <button class="btn btn-secondary" id="btnExportJSON">🗄 Exportar backup completo (.json)</button>
    </div>
    <div class="actions" style="flex-direction:column;padding-top:0;">
      <button class="btn btn-secondary" id="btnImportJSON">📥 Importar backup (.json)</button>
    </div>
  `;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('btnExportCSV').onclick = exportCSV;
  document.getElementById('btnExportJSON').onclick = exportJSON;
  document.getElementById('btnImportJSON').onclick = ()=> document.getElementById('importFile').click();
}
document.getElementById('openBackup').addEventListener('click', openBackupSheet);
document.getElementById('importFile').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(f) importJSONFile(f);
  e.target.value = '';
});

function closeSheet(){ document.getElementById('backdrop').classList.remove('open'); }
document.getElementById('backdrop').addEventListener('click', (e)=>{
  if(e.target.id==='backdrop') closeSheet();
});

document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
